<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="window-opening">
  <!-- Custom Win11-style title bar (frameless window) -->
  <div id="title-bar">
    <div id="title-bar-left">
      <div id="title-bar-icon">✦</div>
      <span id="title-bar-text">Helper — Your Computer Assistant</span>
    </div>
    <div id="title-bar-controls">
      <button class="tb-btn" id="tb-minimize" aria-label="Minimize">─</button>
      <button class="tb-btn" id="tb-maximize" aria-label="Maximize">□</button>
      <button class="tb-btn tb-close" id="tb-close" aria-label="Close">✕</button>
    </div>
  </div>

  <!-- Doing progress bar — visible only during DOING state -->
  <div id="doing-bar"><div id="doing-bar-fill"></div></div>

  <main id="messages">
    <!-- Header scrolls with messages -->
    <div id="header">
      <span id="header-icon">✦</span>
      <span id="header-title">Helper</span>
    </div>

    <!-- Onboarding hint — hidden permanently after first message is sent -->
    <div id="hint">Tap <strong>Speak</strong> or type below to ask for help.</div>

    <!-- Quick suggestion chips — hidden with hint after first message -->
    <div id="chips">
      <button class="chip">My text is too small</button>
      <button class="chip">Close this scary popup</button>
      <button class="chip">Open Chrome</button>
      <button class="chip">Turn up the volume</button>
      <button class="chip">Screen is too dark</button>
    </div>

    <!-- Typing indicator — shown during THINKING state -->
    <div id="typing-indicator" class="hidden">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </main>

  <!-- Status line -->
  <div id="status-text" aria-live="polite"></div>

  <!-- Yes/No confirmation buttons -->
  <div id="mic-area"></div>

  <!-- Bottom input bar -->
  <div id="input-row">
    <textarea id="text-input" placeholder="Type your question here..." rows="2"
      aria-label="Type your question"></textarea>
    <button id="send-btn" aria-label="Send message">Send</button>
    <button id="voice-btn" aria-label="Start or stop voice input">
      <span id="voice-icon">🎤</span>
      <span id="voice-label">Speak</span>
    </button>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
