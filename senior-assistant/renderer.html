<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self' blob:" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="window-opening">
  <!-- macOS-style title bar -->
  <div id="title-bar">
    <div id="title-bar-dots">
      <div class="dot dot-close" id="tb-close"></div>
      <div class="dot dot-minimize"></div>
      <div class="dot dot-maximize"></div>
    </div>
    <div id="title-bar-text">Pal</div>
  </div>

  <!-- Doing progress bar -->
  <div id="doing-bar"><div id="doing-bar-fill"></div></div>

  <!-- Main content area -->
  <main id="messages">
    <!-- Idle state: greeting + mic + chips -->
    <div id="idle-hero">
      <div id="hint">
        Hi there.<br/>I'm here when you need me.
      </div>

      <div id="mic-area">
        <!-- MicAperture hero button -->
        <button id="voice-btn" aria-label="Tap to talk">
          <div id="mic-inner">
            <span id="voice-icon">
              <svg width="53" height="53" viewBox="0 0 24 24" fill="none" stroke="#2A6FBF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="3" width="6" height="12" rx="3" />
                <path d="M5 11a7 7 0 0 0 14 0" />
                <path d="M12 18v3" />
              </svg>
            </span>
          </div>
        </button>
        <div id="voice-label">Tap to talk</div>
      </div>

      <!-- Status text (listening/thinking labels) -->
      <div id="status-text" aria-live="polite"></div>

      <div id="chips">
        <button class="chip">
          <span class="chip-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A6FBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M9 6v13M15 10h6M17 10v9" /></svg>
          </span>
          My text is too small
        </button>
        <button class="chip">
          <span class="chip-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A6FBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" /><path d="M9 12l2 2 4-4" /></svg>
          </span>
          Close this scary popup
        </button>
        <button class="chip">
          <span class="chip-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A6FBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="3.2" /><path d="M12 8.8h8.5M9.4 13.6L5.2 20.5M14.6 13.6L9.7 20.6" /></svg>
          </span>
          Open Chrome
        </button>
        <button class="chip">
          <span class="chip-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A6FBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M17 8a5 5 0 0 1 0 8" /></svg>
          </span>
          Turn up the volume
        </button>
        <button class="chip">
          <span class="chip-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A6FBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" /></svg>
          </span>
          Screen is too dark
        </button>
      </div>
    </div>

    <!-- Typing/thinking indicator -->
    <div id="typing-indicator" class="hidden">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </main>

  <!-- Compact mic row (shown after first response) -->
  <div id="compact-mic-row" class="hidden">
    <button id="compact-mic-btn" aria-label="Tap to ask another question">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A6FBF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button>
    <span id="compact-mic-label">Tap to ask another question</span>
  </div>

  <!-- Bottom input -->
  <div id="input-row">
    <span id="keyboard-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(26,34,54,0.42)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5" /><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10" /></svg>
    </span>
    <input id="text-input" type="text" placeholder="or type here…" aria-label="Type your question" />
    <button id="send-btn" aria-label="Send message">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14-7-5 16-3-7-6-2z" /></svg>
    </button>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
